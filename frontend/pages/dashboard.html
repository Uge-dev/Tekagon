<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <link rel="shortcut icon" href="../Images/TeckIQ mark.png" type="image/x-icon" srcset="" />
  <title>Tekagon Dashboard</title>

  <!-- Feather icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="../webfonts/ywft-avant-modern-regular-demo.ttf" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Your+Chosen+Font&display=swap" />

  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="../styles/service.css" />
  <link rel="stylesheet" href="../styles/onScroll.css" />
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <link rel="stylesheet" href="../styles/portfolio.css">
  <link rel="stylesheet" href="../styles/contact.css">
  <link rel="stylesheet" href="../styles/scheduler.css">
  <link rel="stylesheet" href="../styles/chat.css">
  <link rel="stylesheet" href="../styles/ticket.css">
<!-- Add this link in the <head> section, after other stylesheets -->
<link rel="stylesheet" href="../styles/responsive.css">

</head>

<body>

  <div class="app">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar" aria-label="Main sidebar">
      <div class="sidebar-inner">
        <!-- top: small brand mark -->
        <div class="sidebar-top">
          <div class="brand-mark" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="#2b2f7a"></circle>
              <text x="50%" y="54%" text-anchor="middle" fill="#fff" font-size="12" font-family="Inter, Arial"
                font-weight="700">
                T
              </text>
            </svg>
          </div>
        </div>

        <!-- nav area (scrollable) -->
        <nav class="nav-area" role="navigation" aria-label="Primary navigation">
          <button class="nav-item nav-main active" data-page="home">
            <span class="icon" data-feather="home"></span>
            <span class="label">Home</span>
          </button>

          <button class="nav-item nav-main" data-page="service">
            <span class="icon" data-feather="server"></span>
            <span class="label">Service</span>
          </button>

          <button class="nav-item nav-main" data-page="stack">
            <span class="icon" data-feather="layers"></span>
            <span class="label">Stack</span>
          </button>

          <button class="nav-item nav-main" data-page="book">
            <span class="icon" data-feather="calendar"></span>
            <span class="label">Book a Session</span>
          </button>

          <button class="nav-item nav-main" data-page="chat">
            <span class="icon" data-feather="message-square"></span>
            <span class="label">Chat with Us</span>
          </button>

          <button class="nav-item nav-main" data-page="tickets">
            <span class="icon" data-feather="tag"></span>
            <span class="label">Tickets</span>
          </button>


          <div class="nav-group" data-group="portfolio">
            <button class="nav-item nav-main nav-group-toggle" data-page="portfolio">
              <span class="icon" data-feather="briefcase"></span>
              <span class="label">Portfolio</span>
              <span class="caret" data-feather="chevron-down"></span>
            </button>

            <div class="nav-group-list" aria-hidden="true">
              <button class="nav-subitem" data-page="portfolio-mobile">
                <span class="sub-icon" data-feather="smartphone"></span><span class="sub-label">Mobile App</span>
              </button>
              <button class="nav-subitem" data-page="portfolio-web">
                <span class="sub-icon" data-feather="monitor"></span><span class="sub-label">Web Dev</span>
              </button>
              <button class="nav-subitem" data-page="portfolio-brand">
                <span class="sub-icon" data-feather="pen-tool"></span><span class="sub-label">Branding</span>
              </button>
              <button class="nav-subitem" data-page="portfolio-uiux">
                <span class="sub-icon" data-feather="layout"></span><span class="sub-label">UI/UX & Product</span>
              </button>
            </div>
          </div>
        </nav>

        <!-- spacer to push footer to bottom -->
        <div class="sidebar-spacer"></div>
        <!-- small contact button placed above the footer logo (requested) -->

        <div class="sidebar-contact" style="padding: 8px 16px">
          <button class="nav-item nav-main" data-page="contact"
            style="width: 100%; display: flex; align-items: center; gap: 8px">
            <span class="icon" data-feather="mail"></span>
            <span class="label">Contact Us</span>
          </button>
        </div>

        <!-- footer: Tekagon logo + name -->
        <div class="sidebar-footer" aria-hidden="true">
          <div class="footer-inner">
            <div class="footer-mark">
              <svg width="28" height="28" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="#2b2f7a"></circle>
                <text x="50%" y="54%" text-anchor="middle" fill="#fff" font-size="10" font-family="Inter, Arial"
                  font-weight="700">
                  T
                </text>
              </svg>
            </div>
            <div class="footer-text">
              <div class="company">Tekagon</div>
              <div class="small muted">© Tekagon</div>
            </div>
          </div>
        </div>
      </div>
    </aside>



    <!-- overlay for mobile drawer -->
    <div id="overlay" class="overlay" aria-hidden="true"></div>

    <!-- MAIN -->
    <main class="main">
      <!-- TOPBAR -->
      <header class="topbar">
        <div class="top-left">
          <button id="hamburger" class="hamburger" aria-label="Open menu" title="Open menu">
            <i data-feather="menu"></i>
          </button>
        </div>

        <div class="top-search">
          <input id="globalSearch" type="search" placeholder="Search projects, services, articles..." />
        </div>

        <div class="top-right">
          <button id="notifBtn" class="icon-btn" title="Notifications">
            <i data-feather="bell"></i>
          </button>
          <button id="profileBtn" class="profile-btn" title="Profile">
            <svg width="34" height="34" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="#2b2f7a"></circle>
              <text x="50%" y="54%" text-anchor="middle" fill="#fff" font-size="12" font-family="Inter, Arial"
                font-weight="700">
                T
              </text>
            </svg>
          </button>
        </div>
      </header>

      <!-- CONTENT -->
      <section class="content">
        <section class="banner-wrap" aria-roledescription="carousel">
          <div id="carousel" class="carousel"></div>
          <button id="carouselPrev" class="carousel-btn prev" aria-label="Previous">
          <p> < </p>
          </button>
          <button id="carouselNext" class="carousel-btn next" aria-label="Next">
            <p> > </p>
          </button>
        </section>

        <section id="page" class="page"></section>
      </section>
    </main>
  </div>

  <script>
    // ensure feather icons are replaced after DOM ready inside script.js as well
  </script>
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>
  <!-- Add these script tags for scheduler functionality -->
  <script src="../js/runtime-config.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/calendar.js"></script>
  <script src="../js/sendgrid-client.js"></script>
  <script src="../js/scheduler.js"></script>

  <!-- Your existing scripts -->
  <script src="../js/dashboard.js"></script>
  <script src="../js/contact.js"></script>



  

</body>

</html>
